<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>The Bard's Tale I - Complete Sprite Sheet Index (1 to 63)</title>
  <style>
    body { background: #111; color: #eee; font-family: monospace; padding: 20px; }
    h1 { color: #f59e0b; text-align: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card { background: #222; border: 1px solid #444; border-radius: 8px; padding: 10px; text-align: center; }
    .card h3 { margin: 4px 0 8px; color: #38bdf8; }
    .card img { max-width: 100%; border: 1px solid #555; background: #000; image-rendering: pixelated; }
  </style>
</head>
<body>
  <h1>The Bard's Tale I - Sprite Sheets (01 to 63)</h1>
  <div class="grid" id="gallery"></div>
  <script>
    const gallery = document.getElementById('gallery');
    for (let i = 1; i <= 63; i++) {
      const pad = String(i).padStart(2, '0');
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h3>#${pad} (bt1_${pad}.png)</h3>
        <img src="/assets/sprites/bt1_${pad}.png" alt="Sprite ${pad}" />
      `;
      gallery.appendChild(card);
    }
  </script>
</body>
</html>
