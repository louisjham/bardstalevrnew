<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Bard's Tale VR - Master Game Sprite Catalog (Root Viewer)</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --gold: #f59e0b;
      --cyan: #38bdf8;
      --green: #10b981;
      --red: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px;
    }
    header {
      max-width: 1400px;
      margin: 0 auto 24px;
      text-align: center;
    }
    h1 {
      color: var(--gold);
      margin: 0 0 6px;
      font-size: 28px;
    }
    p.subtitle {
      color: var(--text-muted);
      margin: 0 0 20px;
      font-size: 14px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
      background: rgba(30, 41, 59, 0.7);
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      max-width: 1100px;
      margin: 0 auto 28px;
    }
    .search-box {
      flex: 1;
      min-width: 220px;
      max-width: 380px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .search-box:focus {
      border-color: var(--gold);
    }
    .btn-group {
      display: flex;
      gap: 6px;
    }
    .btn {
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #334155;
      color: #fff;
    }
    .btn.active {
      background: var(--gold);
      color: #000;
      font-weight: 600;
      border-color: var(--gold);
    }
    .counter-badge {
      font-family: monospace;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--green);
      color: var(--green);
    }
    .category-section {
      max-width: 1400px;
      margin: 0 auto 36px;
      background: rgba(30, 41, 59, 0.4);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .category-title {
      color: var(--cyan);
      font-size: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin: 0 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--gold);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .card h4 {
      margin: 8px 0 3px;
      color: var(--gold);
      font-size: 15px;
    }
    .card .id-badge {
      display: inline-block;
      background: #0f172a;
      color: var(--cyan);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-family: monospace;
      margin-bottom: 6px;
    }
    .card .role {
      font-size: 12px;
      color: var(--cyan);
      font-weight: 500;
      margin-bottom: 6px;
    }
    .card .desc {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
      text-align: left;
      background: rgba(15, 23, 42, 0.4);
      padding: 6px 8px;
      border-radius: 4px;
      margin-top: 8px;
    }

    /* SPRITE PREVIEW MODES */
    .preview-box {
      width: 128px;
      height: 128px;
      margin: 0 auto 8px;
      overflow: hidden;
      position: relative;
      border: 2px solid var(--border);
      border-radius: 6px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview-box img {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Animated Mode */
    body.mode-animated .preview-box img {
      width: 512px;
      height: 128px;
      animation: spriteLoop 0.8s steps(4) infinite;
    }
    @keyframes spriteLoop {
      from { transform: translateX(0); }
      to { transform: translateX(-512px); }
    }

    /* Static Mode */
    body.mode-static .preview-box img {
      width: 512px;
      height: 128px;
      transform: translateX(0);
      animation: none;
    }

    /* Full Strip Mode */
    body.mode-strip .preview-box {
      width: 100%;
      height: 64px;
    }
    body.mode-strip .preview-box img {
      position: static;
      width: 100%;
      height: auto;
      transform: none;
      animation: none;
    }

    .img-error {
      color: var(--red);
      font-size: 11px;
      padding: 8px;
    }
  </style>
</head>
<body class="mode-animated">
  <header>
    <h1>The Bard's Tale VR — Master Game Sprite Catalog</h1>
    <p class="subtitle">Complete Animated 4-Frame Spritesheets from 1985 Interplay Master Assets (01 to 63)</p>
    
    <div class="toolbar">
      <input type="text" id="search" class="search-box" placeholder="🔍 Search sprite name, #ID, or keyword..." />
      <div class="btn-group">
        <button class="btn active" id="btn-animated" onclick="setMode('animated')">▶ Animated (4-Frame)</button>
        <button class="btn" id="btn-static" onclick="setMode('static')">⏹ Static Frame</button>
        <button class="btn" id="btn-strip" onclick="setMode('strip')">📜 Full Strip</button>
      </div>
      <div id="counter" class="counter-badge">Loading Sprites...</div>
    </div>
  </header>

          { num: "33", name: "Hydra / Two-Headed Serpent", role: "Multi-Headed Fiend", desc: "Two-headed serpentine beast with yellow bellies and flickering tongues" },
          { num: "29", name: "Eye Spy / Beholder", role: "Ocular Aberration", desc: "Floating pink spherical eyeball aberration with optic nerve tentacles" },
          { num: "42", name: "Gargoyle / Demon", role: "Winged Abyssal Fiend", desc: "Muscular winged horned stone demon with glowing yellow eyes" },
          { num: "34", name: "Earth Elemental / Sand Golem", role: "Living Earth Construct", desc: "Swirling humanoid avatar composed of living sand, dust, and rock particles" },
          { num: "22", name: "Ice Golem / Crystal Golem", role: "Glacial Construct", desc: "Crystalline golem composed of jagged ice and glacial snow chunks" },
          { num: "18", name: "Mage Flame Evoker", role: "Fire Spellcaster", desc: "Sage in magenta robe with wooden staff conjuring an orb of Mage Flame" },
          { num: "09", name: "Archmage / Enchanter", role: "Elder Spellcaster", desc: "Wizard with blonde beard and pointed green wizard hat casting spells" },
          { num: "45", name: "Kylearan the Archmage", role: "Legendary Friendly Wizard", desc: "Sorcerer in silver-trimmed robe with turquoise third-eye forehead gem" },
          { num: "30", name: "Mangar the Dark", role: "Final Boss Arch-Mage", desc: "Hooded sorcerer in royal blue robes raising hands skyward chanting" },
          { num: "12", name: "Celestial Archon / Angel", role: "Holy Summon", desc: "Celestial warrior with white feathered wings, golden halo & broadsword" }
        ]
      }
    ];

    const loadedSet = new Set();
    const totalItems = catalogData.reduce((acc, cat) => acc + cat.items.length, 0);

    function getCandidatePaths(num) {
      return [
        `public/assets/sprites/bt1_${num}.png`,
        `./public/assets/sprites/bt1_${num}.png`,
        `spritesheets/Bard 1 ${num} Amiga_sheet.png`,
        `./spritesheets/Bard 1 ${num} Amiga_sheet.png`,
        `New folder/spritesheets/Bard 1 ${num} Amiga_sheet.png`,
        `./New folder/spritesheets/Bard 1 ${num} Amiga_sheet.png`,
        `assets/sprites/bt1_${num}.png`,
        `/assets/sprites/bt1_${num}.png`
      ];
    }

    function handleImageError(img) {
      let idx = parseInt(img.dataset.tryIndex || '0', 10) + 1;
      const candidates = JSON.parse(img.dataset.candidates || '[]');
      if (idx < candidates.length) {
        img.dataset.tryIndex = idx;
        img.src = candidates[idx];
      } else {
        img.style.display = 'none';
        const err = document.createElement('div');
        err.className = 'img-error';
        err.innerHTML = '⚠️ Image not found';
        img.parentElement.appendChild(err);
      }
    }

    function handleImageLoad(img) {
      loadedSet.add(img.dataset.id);
      updateCounter();
    }

    function updateCounter() {
      const counterEl = document.getElementById('counter');
      const count = loadedSet.size;
      counterEl.textContent = `✅ ${count} / ${totalItems} Sprites Loaded`;
      if (count === totalItems) {
        counterEl.style.background = 'rgba(16, 185, 129, 0.25)';
        counterEl.style.borderColor = 'var(--green)';
      }
    }

    function setMode(mode) {
      document.body.className = `mode-${mode}`;
      document.querySelectorAll('.btn-group .btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-${mode}`);
      if (activeBtn) activeBtn.classList.add('active');
    }

    const catalogEl = document.getElementById('catalog');

    catalogData.forEach(cat => {
      const section = document.createElement('div');
      section.className = 'category-section';
      section.innerHTML = `
        <h2 class="category-title">
          <span>${cat.title}</span>
          <span style="font-size: 13px; font-weight: normal; color: var(--text-muted);">${cat.items.length} Sheets</span>
        </h2>
        <div class="grid"></div>
      `;
      const grid = section.querySelector('.grid');

      cat.items.forEach(item => {
        const candidates = getCandidatePaths(item.num);
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.searchText = `${item.num} ${item.name} ${item.role} ${item.desc}`.toLowerCase();
        card.innerHTML = `
          <div class="preview-box">
            <img 
              data-id="${item.num}"
              data-candidates='${JSON.stringify(candidates)}'
              data-try-index="0"
              src="${candidates[0]}" 
              alt="${item.name}"
              onerror="handleImageError(this)"
              onload="handleImageLoad(this)"
            />
          </div>
          <h4>${item.name}</h4>
          <span class="id-badge">#${item.num} (bt1_${item.num}.png)</span>
          <div class="role">${item.role}</div>
          <div class="desc">${item.desc}</div>
        `;
        grid.appendChild(card);
      });

      catalogEl.appendChild(section);
    });

    const searchInput = document.getElementById('search');
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.trim().toLowerCase();
      document.querySelectorAll('.card').forEach(card => {
        const match = !query || card.dataset.searchText.includes(query);
        card.style.display = match ? '' : 'none';
      });

      document.querySelectorAll('.category-section').forEach(sec => {
        const visibleCards = sec.querySelectorAll('.card:not([style*="display: none"])');
        sec.style.display = visibleCards.length > 0 ? '' : 'none';
      });
    });
  </script>
</body>
</html>
